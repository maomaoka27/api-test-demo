name: API Automation Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pytest requests allure-pytest pyyaml

    - name: Start Server
      run: |
        uvicorn app:app --host 127.0.0.1 --port 8000 &
        sleep 3 # 等待服务启动

    - name: Run Pytest
      run: |
        pytest -v --alluredir=./allure-results